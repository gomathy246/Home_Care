<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Care 4 Ever</title><link rel="stylesheet" href="./styles.css"></head><body>

<div class="page-nav" aria-label="Page navigation">
  <button type="button" class="nav-btn" onclick="history.back()">← Back</button>
  <button type="button" class="nav-btn" onclick="window.location.href='./'">⌂ Home</button>
  <button type="button" class="nav-btn nav-close" onclick="window.location.href='./'">✕ Close</button>
</div>
<div id="app" class="app"></div><script>
const A=document.getElementById('app');
const stats=[['28','Active Clients'],['22','Day Shift'],['18','Night Shift'],['2','Vacant Duties']];
function head(t){return `<header><div><small>CARE 4 EVER</small><h1>${t}</h1></div><i>A</i></header>`}
function nav(p){return `<nav>${[['dashboard','⌂','Home'],['clients','♙','Clients'],['nurses','✚','Nurses'],['roster','▦','Roster'],['more','☰','More']].map(x=>`<button class="${p==x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</nav>`}
const f=(l,p='')=>`<label>${l}<input placeholder="${p||l}"></label>`;
function go(p){let h=''; if(p==='dashboard')h=head('Professional Home Care Services')+`<main class="dashboard-main">
<section class="hero">
  <div class="hero-top"><div><p>▣ &nbsp;Today · 30 September 2026</p><h2>Home Care Operations</h2><div class="tagline">Real Care. Real People. A Healthier Home.</div></div><div class="safe-care"><b>Safe Care</b><span>At Home<br>For A Better Tomorrow</span><strong>⌂♥</strong></div></div>
  <div class="stats">
    <div><em>👥</em><b>28</b><span>Active Clients</span><i>›</i></div>
    <div><em>☀</em><b>22</b><span>Day Shift</span><i>›</i></div>
    <div><em>☾</em><b>18</b><span>Night Shift</span><i>›</i></div>
    <div><em>▣</em><b>2</b><span>Vacant Duties</span><i>›</i></div>
  </div>
</section>
<div class="section-title"><h3>Quick actions</h3><span>Small Support · Big Difference ♡</span></div>
<div class="quick">
 <button onclick="go('enquiry')"><strong>▤＋</strong><span>New Enquiry<small>Register a new enquiry</small></span><i>›</i></button>
 <button onclick="go('newclient')"><strong>♟＋</strong><span>New Client<small>Add a new client</small></span><i>›</i></button>
 <button onclick="go('roster')"><strong>♟</strong><span>Assign Nurse<small>Allocate or change nurse</small></span><i>›</i></button>
 <button onclick="go('accounts')"><strong>₹</strong><span>Receive Payment<small>Record a client payment</small></span><i>›</i></button>
</div>
<h3>Needs attention</h3>
<article class="attention"><strong>⚠</strong><div><b>2 vacant duties</b><p>Tomorrow's roster needs assignment.</p></div><button onclick="go('roster')">View Roster&nbsp; ›</button></article>
</main>`+nav(p);
else if(p==='enquiry')h=head('New Enquiry')+`<main><div class="steps">Enquiry → Follow-up → Convert to Client</div><form class="c4e-form" onsubmit="submitEnquiry(event)"><div class="form-section"><h3>Caller Details</h3><label>Caller Name *<input name="caller_name" required></label><label>Relationship<select name="relationship"><option value="">Select</option><option>Self</option><option>Son</option><option>Daughter</option><option>Spouse</option><option>Relative</option><option>Hospital</option><option>Other</option></select></label><label>Mobile Number *<input name="caller_mobile" inputmode="tel" required></label></div><div class="form-section"><h3>Client Requirement</h3><label>Client Name *<input name="client_name" required></label><label>Area / Locality *<input name="area" required></label><label>Service Required *<select name="service_type" required><option value="">Select service</option><option value="day">Day Shift</option><option value="night">Night Shift</option><option value="day_night">Day + Night</option><option value="single_visit">Single Visit</option></select></label><label>Required From *<input name="required_from" type="date" required></label><label>Clinical Requirement<textarea name="clinical_requirement" placeholder="Condition, recent hospitalisation, nursing requirement..."></textarea></label><label>Referral Source<select name="referral_source"><option value="">Select</option><option>Hospital Referral</option><option>Doctor</option><option>Existing Client</option><option>Google / Internet</option><option>Social Media</option><option>Walk-in</option><option>Other</option></select></label></div><button class="primary" type="submit">Save Enquiry</button><button type="button" onclick="go('enquiries')">View Enquiries</button></form></main>`+nav();else if(p==='clients'){const cs=getClients();h=head('Clients')+`<main><div class="list-head"><div><h2>Clients</h2><p>${cs.length} registered client${cs.length===1?'':'s'}</p></div><button class="primary" onclick="go('newclient')">＋ New Client</button></div>${cs.length?cs.map(c=>`<article class="client-card"><div><span class="pill">${c.client_code}</span><h3>${c.full_name}</h3><p>${c.area||'—'} · ${c.mobile||'No mobile'}</p><p>${c.primary_diagnosis||'Clinical profile pending'}</p></div><button onclick="go('service')">Start Service</button></article>`).join(''):`<div class="empty"><h3>No clients registered</h3><button class="primary" onclick="go('newclient')">Register Client</button></div>`}</main>`+nav();}else if(p==='enquiries'){const es=getEnquiries();h=head('Enquiries')+`<main><div class="list-head"><div><h2>Enquiries</h2><p>${es.length} enquiry record${es.length===1?'':'s'}</p></div><button class="primary" onclick="go('enquiry')">＋ New Enquiry</button></div>${es.length?es.map(x=>`<article class="enquiry-card"><div><span class="pill">${x.enquiry_code}</span><h3>${x.client_name}</h3><p>${x.area} · ${x.service_type.replace('_',' + ')}</p><p>Caller: ${x.caller_name} · ${x.caller_mobile}</p><p>Required: ${x.required_from||'—'}</p></div><div class="card-actions"><button onclick="selectEnquiryForConversion('${x.id}')">Convert to Client</button><button class="ghost-danger" onclick="deleteEnquiry('${x.id}')">Close</button></div></article>`).join(''):`<div class="empty"><h3>No enquiries yet</h3><p>Create the first enquiry to begin.</p><button class="primary" onclick="go('enquiry')">New Enquiry</button></div>`}</main>`+nav();}else if(p==='newclient'){const q=selectedEnquiry();h=head('Client Registration')+`<main>
<div class="steps">${q?`Converting ${q.enquiry_code} → Client Registration`:'New Client Registration'}</div>
<form class="c4e-form" onsubmit="saveClientPrototype(event)">
 <div class="form-section"><h3>Client Details</h3>
  <label>Client Name *<input name="full_name" required value="${q?q.client_name:''}"></label>
  <label>Mobile Number<input name="mobile" inputmode="tel" value="${q?q.caller_mobile:''}"></label>
  <div class="two-col"><label>Date of Birth<input name="dob" type="date"></label><label>Gender<select name="gender"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></label></div>
  <label>Preferred Language<select name="preferred_language"><option value="">Select</option><option>Tamil</option><option>English</option><option>Telugu</option><option>Hindi</option><option>Kannada</option><option>Other</option></select></label>
 </div>
 <div class="form-section"><h3>Residence</h3>
  <label>Full Address *<textarea name="address" required></textarea></label>
  <div class="two-col"><label>Area / Locality *<input name="area" required value="${q?q.area:''}"></label><label>City<input name="city" value="Chennai"></label></div>
  <label>Pincode<input name="pincode" inputmode="numeric"></label>
 </div>
 <div class="form-section"><h3>Medical Information</h3>
  <label>Recent / Previous Treatment Hospital<input name="recent_hospital"></label>
  <label>Primary Diagnosis / Condition<textarea name="primary_diagnosis">${q?q.clinical_requirement:''}</textarea></label>
  <label>Known Allergies<textarea name="allergies"></textarea></label>
 </div>
 <div class="form-section"><h3>Family Contact 1</h3>
  <label>Name *<input name="family1_name" required value="${q?q.caller_name:''}"></label>
  <div class="two-col"><label>Relationship<input name="family1_relationship" value="${q?q.relationship:''}"></label><label>Mobile *<input name="family1_mobile" inputmode="tel" required value="${q?q.caller_mobile:''}"></label></div>
 </div>
 <div class="form-section"><h3>Family Contact 2</h3>
  <label>Name<input name="family2_name"></label>
  <div class="two-col"><label>Relationship<input name="family2_relationship"></label><label>Mobile<input name="family2_mobile" inputmode="tel"></label></div>
 </div>
 <button class="primary" type="submit">Register Client</button>
</form></main>`+nav();}else if(p==='service')h=head('Start Service')+`<main><article><div><small>CLIENT</small><h2>Lakshmi</h2><p>HC-2026-0001 · Anna Nagar</p></div></article><form><label>Service Type<select><option>Day + Night</option><option>Day Shift</option><option>Night Shift</option><option>Single Visit</option></select></label>${f('Start Date','01-10-2026')}${f('Day Rate','₹ 1,500')}${f('Night Rate','₹ 1,700')}<div class="total"><span>Daily Charge</span><b>₹3,200</b></div>${f('Advance Received','₹ 10,000')}<button type="button" class="primary" onclick="go('roster')">Start Service</button></form></main>`;
else if(p==='roster')h=head('Duty Roster')+`<main><div class="date">‹ <b>01 OCT 2026</b> ›</div>${[['DAY · 7 AM–7 PM','Lakshmi','Priya R.'],['DAY · 7 AM–7 PM','Raman','Jaya S.'],['DAY · 7 AM–7 PM','Joseph',''],['NIGHT · 7 PM–7 AM','Lakshmi','Saranya M.'],['NIGHT · 7 PM–7 AM','Raman','']].map(x=>`<article><div><small>${x[0]}</small><br><b>${x[1]}</b></div>${x[2]?`<span class="pill">${x[2]}</span>`:`<button class="danger" onclick="go('assign')">VACANT</button>`}</article>`).join('')}</main>`+nav(p);
else if(p==='assign')h=head('Assign Nurse')+`<main><article><div><b>Joseph · Day Shift</b><p>01-10-2026 · 7 AM–7 PM</p></div></article><h3>Available nurses</h3>${[['Priya R.','Elderly/Wound Care'],['Jaya S.','Elderly/IV Therapy'],['Saranya M.','Tracheostomy/PEG']].map(x=>`<article><div><b>${x[0]}</b><p>${x[1]}</p></div><button onclick="go('roster')">Assign</button></article>`).join('')}</main>`;
else {let t=p==='nurses'?'Nurses':p==='accounts'?'Accounts & Payments':'More';h=head(t)+`<main><div class="empty"><h2>${t}</h2><p>Reserved in the Phase-1 architecture. Supabase connection will plug into this module next.</p></div></main>`+nav(p)} A.innerHTML=h; window.scrollTo(0,0)} go('dashboard');
</script></body></html>
