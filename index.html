<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Care 4 Ever</title><link rel="stylesheet" href="./styles.css"></head><body>

<div class="page-nav" aria-label="Page navigation">
  <button type="button" class="nav-btn" onclick="history.back()">← Back</button>
  <button type="button" class="nav-btn" onclick="window.location.href='./'">⌂ Home</button>
  <button type="button" class="nav-btn nav-close" onclick="window.location.href='./'">✕ Close</button>
</div>
<div id="app" class="app"></div><script>
const A=document.getElementById('app');
const stats=[['28','Active Clients'],['22','Day Shift'],['18','Night Shift'],['2','Vacant Duties']];
function head(t){return `<header><div><small>CARE 4 EVER</small><h1>${t}</h1></div><i>A</i></header>`}
function nav(p){return `<nav>${[['dashboard','⌂','Home'],['clients','♙','Clients'],['nurses','✚','Nurses'],['roster','▦','Roster'],['more','☰','More']].map(x=>`<button class="${p==x[0]?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}</nav>`}
const f=(l,p='')=>`<label>${l}<input placeholder="${p||l}"></label>`;
function go(p){let h=''; if(p==='dashboard')h=head('Admin Dashboard')+`<main><section class="hero"><p>Today · 30 September 2026</p><h2>Home Care Operations</h2><div class="stats">${stats.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></section><h3>Quick actions</h3><div class="quick"><button onclick="go('enquiry')">＋<span>New Enquiry</span></button><button onclick="go('newclient')">♙<span>New Client</span></button><button onclick="go('roster')">▦<span>Assign Nurse</span></button><button onclick="go('accounts')">₹<span>Receive Payment</span></button></div><h3>Needs attention</h3><article><b>⚠</b><div><b>2 vacant duties</b><p>Tomorrow's roster needs assignment.</p></div></article></main>`+nav(p);
else if(p==='enquiry')h=head('New Enquiry')+`<main><form>${f('Caller Name *')}${f('Relationship *')}${f('Mobile Number *')}${f('Client Name *')}${f('Area / Location *')}<label>Service Required<select><option>Day Shift</option><option>Night Shift</option><option>Day + Night</option><option>Single Visit</option></select></label>${f('Required From','dd-mm-yyyy')}<label>Clinical Requirement<textarea></textarea></label><button type="button" class="primary" onclick="go('newclient')">Save & Convert to Client</button></form></main>`;
else if(p==='clients')h=head('Clients')+`<main><button class="primary full" onclick="go('newclient')">＋ New Client</button>${['Lakshmi — Anna Nagar — Day + Night','Raman — Mogappair — Day Shift'].map((x,i)=>`<article><div><b>${x}</b><p>HC-2026-000${i+1} · Active</p></div><button onclick="go('service')">Open</button></article>`).join('')}</main>`+nav(p);
else if(p==='newclient')h=head('Client Registration')+`<main><div class="steps">1 Personal · 2 Medical · 3 Family · 4 Service</div><form>${f('Client Name *')}${f('DOB / Age *')}${f('Mobile Number')}${f('Full Address *')}${f('Area / Landmark *')}<button type="button">⌖ Capture Home Location</button><h3>Medical</h3>${f('Primary Diagnosis / Condition *')}${f('Previous / Recent Hospital')}${f('Treating Doctor')}<h3>Primary Family Contact</h3>${f('Name *')}${f('Relationship *')}${f('Mobile / WhatsApp *')}<h3>Secondary Family Contact</h3>${f('Name')}${f('Relationship')}${f('Mobile / WhatsApp')}<button type="button" class="primary" onclick="go('service')">Save & Continue</button></form></main>`;
else if(p==='service')h=head('Start Service')+`<main><article><div><small>CLIENT</small><h2>Lakshmi</h2><p>HC-2026-0001 · Anna Nagar</p></div></article><form><label>Service Type<select><option>Day + Night</option><option>Day Shift</option><option>Night Shift</option><option>Single Visit</option></select></label>${f('Start Date','01-10-2026')}${f('Day Rate','₹ 1,500')}${f('Night Rate','₹ 1,700')}<div class="total"><span>Daily Charge</span><b>₹3,200</b></div>${f('Advance Received','₹ 10,000')}<button type="button" class="primary" onclick="go('roster')">Start Service</button></form></main>`;
else if(p==='roster')h=head('Duty Roster')+`<main><div class="date">‹ <b>01 OCT 2026</b> ›</div>${[['DAY · 7 AM–7 PM','Lakshmi','Priya R.'],['DAY · 7 AM–7 PM','Raman','Jaya S.'],['DAY · 7 AM–7 PM','Joseph',''],['NIGHT · 7 PM–7 AM','Lakshmi','Saranya M.'],['NIGHT · 7 PM–7 AM','Raman','']].map(x=>`<article><div><small>${x[0]}</small><br><b>${x[1]}</b></div>${x[2]?`<span class="pill">${x[2]}</span>`:`<button class="danger" onclick="go('assign')">VACANT</button>`}</article>`).join('')}</main>`+nav(p);
else if(p==='assign')h=head('Assign Nurse')+`<main><article><div><b>Joseph · Day Shift</b><p>01-10-2026 · 7 AM–7 PM</p></div></article><h3>Available nurses</h3>${[['Priya R.','Elderly/Wound Care'],['Jaya S.','Elderly/IV Therapy'],['Saranya M.','Tracheostomy/PEG']].map(x=>`<article><div><b>${x[0]}</b><p>${x[1]}</p></div><button onclick="go('roster')">Assign</button></article>`).join('')}</main>`;
else {let t=p==='nurses'?'Nurses':p==='accounts'?'Accounts & Payments':'More';h=head(t)+`<main><div class="empty"><h2>${t}</h2><p>Reserved in the Phase-1 architecture. Supabase connection will plug into this module next.</p></div></main>`+nav(p)} A.innerHTML=h; window.scrollTo(0,0)} go('dashboard');
</script></body></html>
